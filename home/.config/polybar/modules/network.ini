[module/wlan]
type = custom/script
exec = bash -c "SSID=\$(nmcli -t -f TYPE,NAME connection show --active | grep '802-11-wireless' | cut -d: -f2); echo \"\${SSID:-offline}\""
interval = 3

label-font = 2
label-padding = 1

click-left = nm-connection-editor &

[module/ble]
type = custom/text
content = BLE
content-font = 2
content-padding = 1
click-left = blueman-manager &
