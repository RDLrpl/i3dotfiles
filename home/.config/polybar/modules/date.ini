[module/date-left]
type = custom/text
content = ""
content-font = 4
content-foreground = ${color.white}

[module/date-right]
type = custom/text
content = ""
content-font = 4
content-foreground = ${color.white}

[module/date]
inherit = etc/base
type = internal/date
interval = 60
time = %I:%M %p %d-%m-%y
label = %time% 
label-font = 2
label-padding = 1