[bar/i3]
monitor = ${assets.monitor}

fixed-center = true
enable-ipc = true
wm-restack = i3
override-redirect = false
locale = en_US.UTF-8

width = 100%
height = 24
line-size = 5
bottom = false

background = ${color.background}
foreground = ${color.brightwhite}

border-color = ${color.background}
border-top-size = 3
border-bottom-size = 3
border-left-size = 3
border-right-size = 3

font-0 = ${assets.font-0}
font-1 = ${assets.font-1}
font-2 = ${assets.font-2}
font-3 = ${assets.font-3}

cursor-click = pointer
cursor-scroll = ns-resize

modules-left = i3 space space window 
modules-center = date-left date date-right
modules-right = tray space wlan space ble space volume space space space cpu

module-margin = 0
module-padding = 0
